[cuts]
centrality_lower = 0.0
centrality_higher = 100.0
min_jet_pt = 10.0
dphi = 2.7
max_abs_a = 0.7
min_entries_per_bin = 50
residual_gaus_fit_half_width = 0.5
residual_alpha_fit_hi = 0.31
# Gaussian fit window for runResponse's JES/JER extraction: [1-x, 1+x] around
# the pT_reco/pT_gen response, analogous to residual_gaus_fit_half_width above
# (which is centered at 0, not 1).
response_gaus_fit_half_width = 0.3

[binning]
# ptavg_edges = [ 30, 70, 100, 175, 250, 500, 1000 ]



# ptavg_edges = [ 40, 50, 60, 80, 120, 600 ]


ptavg_edges = [ 40, 50, 60, 70, 90, 120, 200, 600 ]
[step3]
default_method = "trunc95"
# other options currently available: doubleGauss | trunc90 | trunc95 | gauss
eta_mode = "both"
# other options currently available: abseta | eta | both
