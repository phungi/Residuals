[paths]
veto_map = "data/veto/Winter25Prompt25_RunCDEFG.root"
golden_json = "data/json/Cert_Collisions2025OO_394153_394217_golden.json"

[condor]
# Maps each data/txt/*.txt filelist (basename, no extension) to a run mode:
# triggered | non-triggered | mc. make_condor.sh looks up each filelist it
# would submit here; comment out (or omit) an entry to skip submitting jobs
# for that filelist without moving or renaming the file. The physical dataset
# name (HP0, ZB0, ...) is free-form — only the mapped mode matters.
[condor.filelist_modes]
# filelist_HiForest_2024ppref_MC = "mc"
OO_data_filtered = "triggered"
OO_data_substructure_cut_1GeV = "non-triggered"
OO_pythia_30k_nominal = "mc"
# PYTHIA_HIJING_OO_MCEmbedded   = "mc"


[trees]
hi = "hiEvtAnalyzer/HiTree"
skim = "skimanalysis/HltTree"
trigger = "hltanalysis/HltTree"
# Primary vertex filter branch, read from the skim tree (data only).
filter = [
    "pprimaryVertexFilter",
    "OOphfCoincFilterPF2Th4",
    "pileupVertexFilter"
    ]
jets = [
    # "ak2PFJetAnalyzer/t",
    # "ak3PFJetAnalyzer/t",
    "akCs4PFJetAnalyzer/t",
    # "ak5PFJetAnalyzer/t",
    # "ak6PFJetAnalyzer/t",
]

[trigger]
# put the lowest trigger in the end
branch = [
    "HLT_OxyL1SingleJet20_v1",
    "HLT_MinimumBiasHF_OR_BptxAND_v1",
]
lowest_prescale = 1.2
threshold = 1
cone = "ak4PF"

[jet_id]
veto_map_histogram = "jetvetomap_all"

[cones]
labels = [ 
    # "ak2PF", 
    # "ak3PF", 
    "ak4PF", 
    # "ak5PF", 
